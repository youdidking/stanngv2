<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="New York skyline at midnight, 1950, halftone">
  <defs>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.15" fill="#15130f"/>
    </pattern>
    <pattern id="dots-soft" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#15130f"/>
    </pattern>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#15130f" stroke-width="2"/>
    </pattern>
    <pattern id="hatch-soft" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#15130f" stroke-width="1"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15130f"/>
      <stop offset="0.62" stop-color="#15130f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#15130f" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15130f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#15130f" stop-opacity="0.95"/>
    </linearGradient>
    <mask id="cut">
      <rect width="1000" height="420" fill="#fff"/>
    </mask>
  </defs>

  <rect width="1000" height="420" fill="#e0d9c8"/>

  <!-- sky -->
  <rect width="1000" height="420" fill="url(#sky)" opacity=".5"/>
  <rect width="1000" height="420" fill="url(#dots-soft)" opacity=".30"/>

  <!-- moon: a halftone disk -->
  <g transform="translate(806 92)">
    <circle r="52" fill="#e0d9c8"/>
    <circle r="52" fill="url(#dots)" opacity=".28"/>
    <circle r="52" fill="none" stroke="#15130f" stroke-width="1.4" opacity=".7"/>
  </g>

  <!-- distant row -->
  <g fill="#15130f" opacity=".30">
    <rect x="0" y="212" width="46" height="118"/>
    <rect x="52" y="232" width="34" height="98"/>
    <rect x="94" y="196" width="26" height="134"/>
    <rect x="126" y="224" width="40" height="106"/>
    <rect x="176" y="206" width="30" height="124"/>
  </g>

  <!-- Empire-ish tower, right of frame -->
  <g>
    <path d="M724 330V152l16-16V96h10v30l14 14v190z" fill="#15130f" opacity=".92"/>
    <path d="M736 96V74l4-22 4 22v22z" fill="#15130f"/>
    <rect x="730" y="150" width="38" height="180" fill="url(#hatch-soft)"/>
  </g>

  <!-- Chrysler-ish setback tower, centre-left -->
  <g fill="#15130f">
    <path d="M366 330V206h56v124z" opacity=".95"/>
    <path d="M370 206l-4-26h52l-4 26z" opacity=".95"/>
    <path d="M376 180l-3-22h34l-3 22z" opacity=".95"/>
    <path d="M382 158l-2-20h20l-2 20z" opacity=".95"/>
    <path d="M390 138V96l2-30 2 30v42z"/>
  </g>

  <!-- wide mid-rise block -->
  <g fill="#15130f">
    <rect x="430" y="248" width="150" height="82" opacity=".9"/>
    <rect x="446" y="236" width="118" height="12" opacity=".9"/>
    <rect x="596" y="262" width="96" height="68" opacity=".85"/>
  </g>

  <!-- left tall block -->
  <g fill="#15130f">
    <rect x="42" y="176" width="92" height="154" opacity=".93"/>
    <rect x="42" y="168" width="92" height="8" opacity=".93"/>
    <rect x="120" y="132" width="4" height="42"/>
    <rect x="52" y="260" width="128" height="70" opacity=".9"/>
  </g>

  <!-- windows: knocked out of the masses with soft white -->
  <g fill="#e0d9c8" opacity=".55">
    <!-- left block -->
    <g>
      <rect x="54" y="190" width="10" height="14"/><rect x="72" y="190" width="10" height="14"/>
      <rect x="90" y="190" width="10" height="14"/><rect x="108" y="190" width="10" height="14"/>
      <rect x="54" y="214" width="10" height="14"/><rect x="90" y="214" width="10" height="14"/>
      <rect x="108" y="214" width="10" height="14"/>
      <rect x="72" y="238" width="10" height="14"/><rect x="108" y="238" width="10" height="14"/>
      <rect x="54" y="276" width="10" height="14"/><rect x="90" y="276" width="10" height="14"/>
      <rect x="140" y="276" width="10" height="14"/><rect x="158" y="276" width="10" height="14"/>
      <rect x="72" y="300" width="10" height="14"/><rect x="140" y="300" width="10" height="14"/>
    </g>
    <!-- centre tower -->
    <g>
      <rect x="378" y="216" width="8" height="12"/><rect x="392" y="216" width="8" height="12"/>
      <rect x="406" y="216" width="8" height="12"/>
      <rect x="378" y="238" width="8" height="12"/><rect x="406" y="238" width="8" height="12"/>
      <rect x="392" y="260" width="8" height="12"/><rect x="406" y="260" width="8" height="12"/>
      <rect x="378" y="282" width="8" height="12"/><rect x="406" y="282" width="8" height="12"/>
    </g>
    <!-- wide block -->
    <g>
      <rect x="442" y="260" width="12" height="10"/><rect x="462" y="260" width="12" height="10"/>
      <rect x="482" y="260" width="12" height="10"/><rect x="502" y="260" width="12" height="10"/>
      <rect x="522" y="260" width="12" height="10"/><rect x="542" y="260" width="12" height="10"/>
      <rect x="452" y="282" width="12" height="10"/><rect x="492" y="282" width="12" height="10"/>
      <rect x="532" y="282" width="12" height="10"/>
      <rect x="440" y="304" width="12" height="10"/><rect x="480" y="304" width="12" height="10"/>
      <rect x="520" y="304" width="12" height="10"/><rect x="560" y="304" width="12" height="10"/>
      <rect x="610" y="276" width="10" height="9"/><rect x="630" y="276" width="10" height="9"/>
      <rect x="650" y="276" width="10" height="9"/><rect x="670" y="276" width="10" height="9"/>
      <rect x="620" y="298" width="10" height="9"/><rect x="660" y="298" width="10" height="9"/>
    </g>
    <!-- empire windows -->
    <g>
      <rect x="736" y="170" width="8" height="10"/><rect x="752" y="170" width="8" height="10"/>
      <rect x="736" y="196" width="8" height="10"/><rect x="752" y="196" width="8" height="10"/>
      <rect x="736" y="222" width="8" height="10"/><rect x="752" y="222" width="8" height="10"/>
      <rect x="736" y="248" width="8" height="10"/><rect x="752" y="248" width="8" height="10"/>
      <rect x="736" y="274" width="8" height="10"/><rect x="752" y="274" width="8" height="10"/>
      <rect x="736" y="300" width="8" height="10"/><rect x="752" y="300" width="8" height="10"/>
    </g>
  </g>

  <!-- street level -->
  <rect x="0" y="330" width="1000" height="90" fill="url(#street)"/>
  <rect x="0" y="330" width="1000" height="90" fill="url(#dots)" opacity=".22"/>

  <!-- street lamps -->
  <g stroke="#15130f" stroke-width="2.6" fill="none">
    <path d="M168 330V244h-14"/>
    <path d="M832 330V252h16"/>
  </g>
  <g fill="#e0d9c8">
    <circle cx="152" cy="242" r="7"/><circle cx="850" cy="250" r="7"/>
  </g>
  <g fill="none" stroke="#15130f" stroke-width="1">
    <circle cx="152" cy="242" r="13" opacity=".5"/><circle cx="850" cy="250" r="13" opacity=".5"/>
  </g>

  <!-- cab, 1950 silhouette -->
  <g fill="#15130f">
    <path d="M108 400c0-14 10-20 22-21l14-24c3-6 9-9 16-9h52c8 0 14 3 18 9l16 24c14 1 24 8 24 21v12H108z"/>
    <path d="M150 356h44l10 18h-64z" fill="#e0d9c8" opacity=".85"/>
    <circle cx="146" cy="414" r="14"/><circle cx="256" cy="414" r="14"/>
  </g>
  <g fill="#e0d9c8"><circle cx="146" cy="414" r="5"/><circle cx="256" cy="414" r="5"/></g>
  <g fill="#15130f" opacity=".9"><rect x="286" y="372" width="40" height="12"/><rect x="118" y="372" width="34" height="10"/></g>

  <!-- bus -->
  <g fill="#15130f" opacity=".92">
    <rect x="612" y="352" width="220" height="62" rx="3"/>
    <rect x="626" y="344" width="192" height="10" rx="3"/>
  </g>
  <g fill="#e0d9c8" opacity=".6">
    <rect x="626" y="364" width="34" height="22"/><rect x="668" y="364" width="34" height="22"/>
    <rect x="710" y="364" width="34" height="22"/><rect x="752" y="364" width="34" height="22"/>
    <rect x="794" y="364" width="24" height="22"/>
  </g>
  <g fill="#15130f"><circle cx="652" cy="418" r="12"/><circle cx="792" cy="418" r="12"/></g>

  <!-- pedestrians -->
  <g fill="#15130f">
    <g transform="translate(420 332)">
      <circle cx="0" cy="12" r="8"/>
      <path d="M-4 15h9l6 10-3 15 4 22h-6l-4-18-3 18h-6l4-22-5-13 4-6z"/>
      <path d="M-9 16h20v3h-20z"/>
    </g>
    <g transform="translate(470 340) scale(1.08)">
      <circle cx="0" cy="12" r="8"/>
      <path d="M-4 15h9l6 10-3 15 4 22h-6l-4-18-3 18h-6l4-22-5-13 4-6z"/>
      <path d="M-11 17h24v3h-24z"/>
    </g>
    <g transform="translate(556 336) scale(.95)">
      <circle cx="0" cy="12" r="8"/>
      <path d="M-4 15h9l6 10-3 15 4 22h-6l-4-18-3 18h-6l4-22-5-13 4-6z"/>
      <path d="M-8 16h18v3h-18z"/>
    </g>
  </g>

  <!-- crosswalk stripes in perspective -->
  <g fill="#e0d9c8" opacity=".5">
    <path d="M300 420l8-26h18l-2 26z"/><path d="M346 420l6-30h20l-1 30z"/>
    <path d="M398 420l4-34h22v34z"/><path d="M454 420l1-38h24v38z"/>
    <path d="M512 420l-2-42h26l3 42z"/><path d="M572 420l-4-46h28l4 46z"/>
  </g>

  <!-- newsboy stand -->
  <g>
    <rect x="20" y="352" width="72" height="46" fill="#15130f" opacity=".92"/>
    <path d="M14 352h84l-10-16H24z" fill="#15130f"/>
    <rect x="30" y="366" width="52" height="8" fill="#e0d9c8" opacity=".7"/>
    <rect x="30" y="380" width="34" height="6" fill="#e0d9c8" opacity=".5"/>
  </g>

  <!-- halftone overlay + frame -->
  <rect width="1000" height="420" fill="url(#hatch)" opacity=".05"/>
  <rect x="1" y="1" width="998" height="418" fill="none" stroke="#15130f" stroke-width="2"/>
</svg>
